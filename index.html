<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend's Voice - Access Gate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-black: #000000;
            --bg-base: #121212;
            --bg-card: #181818;
            --accent-green: #1ed760;
            --accent-green-hover: #1fdf64;
            --text-gray: #b3b3b3;
            --text-white: #ffffff;
            --error-red: #ff4d4d;
            --transition-fast: all 0.2s ease;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at center, #103922 0%, var(--bg-black) 70%);
        }

        .login-card {
            background-color: var(--bg-base);
            border: 1px solid #282828;
            border-radius: 16px;
            padding: 36px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-white);
            margin-bottom: 24px;
        }

        .logo-icon {
            background: var(--accent-green);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #000;
            font-size: 1.1rem;
        }

        .login-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-card p {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 24px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            background-color: #242424;
            border: 1px solid #333;
            color: var(--text-white);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-fast);
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-green);
            background-color: #2a2a2a;
        }

        .error-message {
            color: var(--error-red);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            background-color: var(--accent-green);
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-top: 8px;
            transition: var(--transition-fast);
        }

        .submit-btn:hover {
            background-color: var(--accent-green-hover);
            transform: scale(1.02);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #666;
        }

        .developer-credit {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-gray);
            border-top: 1px solid #282828;
            padding-top: 12px;
        }

        .developer-credit span {
            color: var(--accent-green);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <div class="logo-icon">🎵</div>
            <span>Friend's Voice</span>
        </div>

        <h2>Access Vault</h2>
        <p>Please enter your details to access the player</p>

        <form id="accessForm" onsubmit="validateAndSubmit(event)">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="Enter your city/address" required>
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <select id="country" required>
                    <option value="" disabled selected>Select your country</option>
                    <option value="Bangladesh">Bangladesh</option>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                    <option value="Canada">Canada</option>
                    <option value="Saudi Arabia">Saudi Arabia</option>
                    <option value="UAE">UAE</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter secret password" required>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <button type="submit" class="submit-btn">Access Player</button>
        </form>

        <div class="footer-note">
            Restricted access for authorized friends & users only.
        </div>

        <div class="developer-credit">
            Developed by <span>Mahmudul Hasan Shakib</span>
        </div>
    </div>

    <script>
        const SECRET_PASSWORD = "30Sha11";

        function validateAndSubmit(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const address = document.getElementById('address').value.trim();
            const country = document.getElementById('country').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            // 1. Verify all fields are filled
            if (!fullName || !address || !country) {
                errorMsg.innerText = "Please fill out all fields before submitting.";
                errorMsg.style.display = "block";
                return;
            }

            // 2. Verify password
            if (password !== SECRET_PASSWORD) {
                errorMsg.innerText = "Incorrect password! Access denied.";
                errorMsg.style.display = "block";
                document.getElementById('password').value = "";
                document.getElementById('password').focus();
                return;
            }

            // 3. Save authentication flag and user details in sessionStorage
            errorMsg.style.display = "none";
            sessionStorage.setItem('is_authenticated', 'true');
            sessionStorage.setItem('user_name', fullName);
            sessionStorage.setItem('user_address', address);
            sessionStorage.setItem('user_country', country);

            // 4. Redirect to music.html
            window.location.href = "music.html";
        }
    </script>
</body>
</html>
